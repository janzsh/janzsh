name: Actualizar estadísticas

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.json, scripts/build.mjs]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar SVG
        run: node scripts/build.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats README.md
          # pull --rebase por si llegó un push a main mientras corría el job
          git diff --cached --quiet || (git commit -m "chore: actualizar estadísticas" && git pull --rebase && git push)
